version: 2
# Patch and minor updates are auto-merged once every required check passes
# (workflows/dependabot-auto-merge.yml); major updates wait for the maintainer, since a new major app version
# can migrate its database one way. A merge deploys: the server's pull agent applies main within minutes.
updates:
  # The stack's images in compose.yaml (version tag and digest).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    assignees: ["HoneyBearTech"]

  # The check and test tools (requirements-dev.txt), pinned with hashes.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    assignees: ["HoneyBearTech"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    assignees: ["HoneyBearTech"]
    groups:
      # init, analyze and upload-sarif must share one version.
      codeql:
        patterns:
          - "github/codeql-action*"
