version: 2
# Patch, minor and major updates are auto-merged once every required check passes
# (workflows/dependabot-auto-merge.yml; majors since the owner's decision of 2026-10-14); an update Dependabot can't
# classify waits for the maintainer. A merge deploys: the server's pull agent applies main within minutes, so a
# major, which can migrate an app's database one way, arrives unattended with the nightly backup behind it.
updates:
  # The stack's images in compose.yaml (version tag and digest).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    assignees: ["HoneyBearTech"]

  # The check and test tools (requirements-dev.txt), pinned with hashes.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    assignees: ["HoneyBearTech"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    assignees: ["HoneyBearTech"]
    groups:
      # init, analyze and upload-sarif must share one version.
      codeql:
        patterns:
          - "github/codeql-action*"
