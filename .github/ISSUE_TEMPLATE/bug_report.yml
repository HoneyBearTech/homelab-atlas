name: Bug report
description: The stack doesn't start, a service misbehaves after an upgrade, or the docs are wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting. **Security problems go to the private form instead** (see SECURITY.md).
        Leave out API keys, passwords, hostnames, IP addresses and paths: replace them with placeholders.
        A bug in Radarr, Sonarr or another app itself belongs with that project.
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        The homelab-atlas release (for example 0.1.0) or commit you run, and your Docker and Compose versions.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Which service, and what you ran (for example `docker compose up -d` after `git pull`).
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: The relevant part of `docker compose logs <service>`. Check it for API keys before pasting.
      render: text
