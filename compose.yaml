# The Atlas stack. Every setting comes from .env (template: .env.example; reference: docs/interfaces.md); autoheal's
# optional webhook from autoheal.env (template: autoheal.env.example), and the Dozzle agent's certificate and key from
# files under CONFIG_ROOT/dozzle/certs (Docker secrets, at the end). Each app keeps its settings, API key and database
# in its config directory, CONFIG_ROOT/<app>/config, mounted at /config, and any other folder of its own beside it
# (Radarr's scripts in CONFIG_ROOT/radarr/scripts). No app data lives in a Docker volume, and no
# setting may point into /var/lib/docker/volumes: `docker volume prune` deletes a volume no container mounts as one,
# even one whose _data folder a service bind-mounts (docs/installing.md#where-data-lives). scripts/backup.sh backs
# up every read-write mount (the apps' /config, Radarr's /scripts) except the ones a service's
# org.honeybeartech.atlas.backup.skip label lists (/media, SABnzbd's /incomplete), and leaves out of a mount what its
# org.honeybeartech.atlas.backup.exclude label lists.
# Every image is pinned as name:tag@sha256:<digest>; Dependabot proposes updates (patch, minor and major ones and
# rebuilds merge automatically once CI passes). scripts/check_compose.py enforces the policy (docs/security.md#policy).

name: homelab-atlas

# Every service starts with no Linux capabilities and can't gain privileges (setuid binaries, file capabilities);
# a service that needs a capability adds back only that one, from Docker's default set (docs/security.md#hardening).
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# The linuxserver.io apps: their init (s6) runs as root, takes ownership of /config and the app's own directories
# for PUID:PGID and starts the app as that user, so they get back what that takes, each proven by the smoke test
# and by starting the image without it (docs/security.md#hardening). Their root filesystem stays writable: s6-overlay
# runs its init from /run (a tmpfs there is mounted noexec) and the init rewrites /etc/passwd for PUID.
x-linuxserver: &linuxserver
  <<: *hardened
  cap_add:
    - CHOWN # the init's chown of /config, /app and /run: without it the app can't write its database
    - DAC_OVERRIDE # the init enters directories it doesn't own while re-owning /config (data from elsewhere)
    - SETUID # s6-applyuidgid switches to PUID before it starts the app
    - SETGID # and sets PGID and the supplementary groups
    - KILL # s6 signals the app (running as PUID) to stop; without it every stop waits 30 s and kills the app

x-linuxserver-env: &linuxserver-env
  PUID: ${PUID:?set PUID in .env}
  PGID: ${PGID:?set PGID in .env}
  TZ: ${TZ:?set TZ in .env}
  UMASK: ${UMASK:-002}

# Health check timing shared by every service; each service adds its own test. During start_period a failing
# check doesn't count, and Docker checks every start_interval so a healthy app shows up within seconds. The long
# start_period keeps autoheal from restarting an app in the middle of a slow database migration after an upgrade.
x-healthcheck: &healthcheck
  interval: 1m
  timeout: 10s
  retries: 3
  start_period: 10m
  start_interval: 5s

services:
  # --- Movies ---------------------------------------------------------------------------------------------------
  radarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/radarr:version-6.4.4.10685@sha256:ff4430fe2d6159b4dbaac9903acfecee5aa68dec8c929259e2f3114c63f7a09e
    container_name: radarr
    restart: unless-stopped
    labels:
      autoheal: "true"
      # The media library: on its own storage, far too large to back up here. Never archived or restored.
      org.honeybeartech.atlas.backup.skip: "/media"
      # Posters the app downloads again by itself; too large to copy every night.
      org.honeybeartech.atlas.backup.exclude: "/config/MediaCover"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7878/ping"]
    environment: *linuxserver-env
    ports:
      - "7878:7878"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/radarr/config:/config
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/media
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/radarr/scripts:/scripts

  radarr4k:
    <<: *linuxserver
    image: lscr.io/linuxserver/radarr:version-6.4.4.10685@sha256:ff4430fe2d6159b4dbaac9903acfecee5aa68dec8c929259e2f3114c63f7a09e
    container_name: radarr4k
    restart: unless-stopped
    labels:
      autoheal: "true"
      # The media library: on its own storage, far too large to back up here. Never archived or restored.
      org.honeybeartech.atlas.backup.skip: "/media"
      # Posters the app downloads again by itself; too large to copy every night.
      org.honeybeartech.atlas.backup.exclude: "/config/MediaCover"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7878/ping"]
    environment: *linuxserver-env
    ports:
      - "17878:7878"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/radarr4k/config:/config
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/media
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/radarr4k/scripts:/scripts

  # --- TV -------------------------------------------------------------------------------------------------------
  sonarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/sonarr:version-4.0.20.3014@sha256:48e36b608b461273b9dae857725cd0561a127f2c694b687318f6d0c5ce63e5c9
    container_name: sonarr
    restart: unless-stopped
    labels:
      autoheal: "true"
      # The media library: on its own storage, far too large to back up here. Never archived or restored.
      org.honeybeartech.atlas.backup.skip: "/media"
      # Posters the app downloads again by itself; too large to copy every night.
      org.honeybeartech.atlas.backup.exclude: "/config/MediaCover"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8989/ping"]
    environment: *linuxserver-env
    ports:
      - "8989:8989"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/sonarr/config:/config
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/media

  sonarr4k:
    <<: *linuxserver
    image: lscr.io/linuxserver/sonarr:version-4.0.20.3014@sha256:48e36b608b461273b9dae857725cd0561a127f2c694b687318f6d0c5ce63e5c9
    container_name: sonarr4k
    restart: unless-stopped
    labels:
      autoheal: "true"
      # The media library: on its own storage, far too large to back up here. Never archived or restored.
      org.honeybeartech.atlas.backup.skip: "/media"
      # Posters the app downloads again by itself; too large to copy every night.
      org.honeybeartech.atlas.backup.exclude: "/config/MediaCover"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8989/ping"]
    environment: *linuxserver-env
    ports:
      - "8988:8989"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/sonarr4k/config:/config
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/media

  # --- Music ----------------------------------------------------------------------------------------------------
  lidarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/lidarr:version-3.1.0.4875@sha256:d8549ff9ea29b4015c32257360652c1000c31ea471a2b3f0835ae77292faf35b
    container_name: lidarr
    restart: unless-stopped
    labels:
      autoheal: "true"
      # The media library: on its own storage, far too large to back up here. Never archived or restored.
      org.honeybeartech.atlas.backup.skip: "/media"
      # Posters the app downloads again by itself; too large to copy every night.
      org.honeybeartech.atlas.backup.exclude: "/config/MediaCover"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8686/ping"]
    environment: *linuxserver-env
    ports:
      - "8686:8686"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/lidarr/config:/config
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/media

  # --- Subtitles ------------------------------------------------------------------------------------------------
  bazarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/bazarr:version-v1.6.2@sha256:946dc8c5bb5331418eac60050cf40a63cb8f66ac039841dda493870e3559799c
    container_name: bazarr
    restart: unless-stopped
    labels:
      autoheal: "true"
      # The media library: on its own storage, far too large to back up here. Never archived or restored.
      org.honeybeartech.atlas.backup.skip: "/media"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:6767/api/system/ping"]
    environment: *linuxserver-env
    ports:
      - "6767:6767"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/bazarr/config:/config
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/media

  bazarr4k:
    <<: *linuxserver
    image: lscr.io/linuxserver/bazarr:version-v1.6.2@sha256:946dc8c5bb5331418eac60050cf40a63cb8f66ac039841dda493870e3559799c
    container_name: bazarr4k
    restart: unless-stopped
    labels:
      autoheal: "true"
      # The media library: on its own storage, far too large to back up here. Never archived or restored.
      org.honeybeartech.atlas.backup.skip: "/media"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:6767/api/system/ping"]
    environment: *linuxserver-env
    ports:
      - "6768:6767"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/bazarr4k/config:/config
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/media

  # --- Downloads ------------------------------------------------------------------------------------------------
  sabnzbd:
    <<: *linuxserver
    image: lscr.io/linuxserver/sabnzbd:version-5.1.3@sha256:3ac1c9ea03bafa2588dd8acdcb809857bae305e71d2d90e11d689c78076a9c01
    container_name: sabnzbd
    restart: unless-stopped
    # Time to finish writing to /incomplete, which may be a network share, and exit cleanly on stop (as for the nightly
    # backup) instead of being killed after Docker's default 10 s in the middle of a write.
    stop_grace_period: 1m
    labels:
      autoheal: "true"
      # The media library (on its own storage, far too large to back up here) and unfinished downloads: never
      # archived or restored.
      org.honeybeartech.atlas.backup.skip: "/media,/incomplete"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api?mode=version"]
    environment: *linuxserver-env
    ports:
      - "8080:8080"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/sabnzbd/config:/config
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/media
      # Where downloads are assembled before they're complete (SABnzbd's "Temporary Download Folder"); it stores this
      # path, so /incomplete never changes. Not backed up (backup.skip above).
      - ${SABNZBD_INCOMPLETE_PATH:?set SABNZBD_INCOMPLETE_PATH in .env}:/incomplete

  # --- Quality profiles (TRaSH Guides) --------------------------------------------------------------------------
  recyclarr:
    <<: *hardened
    image: recyclarr/recyclarr:8.8.0@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209
    container_name: recyclarr
    restart: unless-stopped
    # Writes only its config directory, and its crontab to /tmp.
    read_only: true
    tmpfs:
      - /tmp
    labels:
      autoheal: "true"
    # Recyclarr has no web server; it's healthy while its scheduler (supercronic) runs.
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "pgrep", "-x", "supercronic"]
    user: ${PUID:?set PUID in .env}:${PGID:?set PGID in .env}
    environment:
      TZ: ${TZ:?set TZ in .env}
      RECYCLARR_CREATE_CONFIG: "true"
    volumes:
      # Recyclarr runs as PUID:PGID and can't take ownership of a directory: create this one as that user (Docker
      # would create it owned by root).
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/recyclarr/config:/config

  # --- Requests -------------------------------------------------------------------------------------------------
  # Seerr: the request front end (successor of Overseerr and Jellyseerr). Viewers ask for movies and shows there;
  # it sends them to Radarr and Sonarr (and their 4K instances) on this stack's network and checks Plex for what's
  # already in the library. Its settings, API key and database live in its config directory.
  seerr:
    <<: *hardened
    image: ghcr.io/seerr-team/seerr:v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
    container_name: seerr
    restart: unless-stopped
    # Node isn't PID 1: tini reaps child processes and passes on signals (the project's own compose does the same).
    init: true
    # Writes only its config directory (database, settings, logs) and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    labels:
      autoheal: "true"
      # Its own logs: rotated by the app, not worth a nightly copy.
      org.honeybeartech.atlas.backup.exclude: "/app/config/logs"
    # /api/v1/status answers without a login (version only).
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5055/api/v1/status"]
    user: ${PUID:?set PUID in .env}:${PGID:?set PGID in .env}
    environment:
      TZ: ${TZ:?set TZ in .env}
    ports:
      - "5055:5055"
    volumes:
      # Seerr runs as PUID:PGID and can't take ownership of a directory: create this one as that user (Docker would
      # create it owned by root).
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/seerr/config:/app/config

  # --- Operations -----------------------------------------------------------------------------------------------
  # A Dozzle agent: it serves this host's container logs to the homelab's Dozzle on another host, which shows the
  # logs of every host in one web UI. It has no web UI of its own. Keep it on the hub's version. It accepts only a hub
  # that presents the homelab's own certificate and key (the secrets at the end), never the pair built into every
  # Dozzle image, which anyone can use.
  dozzle:
    <<: *hardened
    image: amir20/dozzle:v11.3.4@sha256:8796ae7e1ecbe011482319cb7040e69aae91a0632b87bbe24b3f643e7455d94b
    container_name: dozzle
    restart: unless-stopped
    command: agent
    # The agent writes only its address file to /tmp and the notification settings the Dozzle hub sends it to /data,
    # both in memory: the hub keeps those settings itself and sends them again each time it starts.
    read_only: true
    tmpfs:
      - /tmp
      - /data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/dozzle", "healthcheck"]
    labels:
      autoheal: "true"
      org.honeybeartech.atlas.allow.docker-socket: >-
        The Dozzle agent reads container logs through the Docker API for the Dozzle hub. The socket is mounted
        read-only, which protects the socket file but not the API, so the agent's port must stay on the LAN.
    environment:
      DOZZLE_CERT: /run/secrets/dozzle_cert
      DOZZLE_KEY: /run/secrets/dozzle_key
    secrets:
      - dozzle_cert
      - dozzle_key
    ports:
      - "7007:7007"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Restarts any container labelled autoheal: "true" that Docker reports unhealthy (Docker itself only restarts a
  # container whose process exits). It reaches Docker only through socket-proxy, which lets it list, inspect,
  # restart and stop containers and nothing else. Optional restart notices go to a webhook from autoheal.env.
  autoheal:
    <<: *hardened
    image: willfarrell/autoheal:latest@sha256:e7f42d5365c7c4490dd0cafc2858bb9fd2d64a274448d2de2bb5c386f1af7a0f
    container_name: autoheal
    restart: unless-stopped
    read_only: true
    # autoheal exits if it can't reach the proxy, so it starts only once the proxy answers. (After a host reboot
    # Docker starts both at once; autoheal then restarts until the proxy is up, a few seconds.)
    depends_on:
      socket-proxy:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      start_period: 1m
      test: ["CMD", "pgrep", "-f", "autoheal"]
    labels:
      org.honeybeartech.atlas.allow.latest: >-
        The image publishes "latest" (rebuilt regularly) and versioned tags only up to 1.2.0 from 2021, so the
        maintained image is "latest", pinned by digest.
    environment:
      DOCKER_SOCK: tcp://socket-proxy:2375
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      # Give an app time to shut down cleanly (and finish database writes) before it's restarted.
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
      # Discord's webhook API reads the message from "content".
      WEBHOOK_JSON_KEY: content
    env_file:
      - path: autoheal.env
        required: false
    networks:
      - default
      - docker-proxy

  # The only service with the Docker socket besides Dozzle. It answers on an internal network with no published
  # port, and passes on only what autoheal needs: listing and inspecting containers, and restarting or stopping
  # them (CONTAINERS, ALLOW_RESTARTS). Creating, starting or deleting containers, exec, images, volumes and every
  # other POST are refused.
  socket-proxy:
    <<: *hardened
    image: lscr.io/linuxserver/socket-proxy:3.4.7@sha256:e5d819de59b343c01b2fe7adc7fad3c7a60e5dba08e45f1ac317352bc08599b5
    container_name: socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      <<: *healthcheck
      start_period: 1m
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2375/_ping"]
    labels:
      autoheal: "true"
      org.honeybeartech.atlas.allow.docker-socket: >-
        A filtering proxy so that autoheal never gets the socket itself: it allows only listing, inspecting,
        restarting and stopping containers, on an internal network with no published port. The socket mount is
        read-only, which protects the socket file but not the API; the proxy's filter is what limits it.
    environment:
      CONTAINERS: 1
      ALLOW_RESTARTS: 1
      POST: 0
      EVENTS: 0
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy

networks:
  # The apps' network keeps one address range (STACK_SUBNET) whenever Compose recreates it, so a host firewall rule
  # that lets the apps reach each other through the host's own address keeps matching (docs/installing.md#firewall).
  # Without a fixed range Docker picks any free one, and the rule silently stops matching.
  default:
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-172.25.0.0/16}
  # socket-proxy's network: internal, so nothing on it can reach the outside world and nothing outside can reach
  # the proxy; only autoheal joins it.
  docker-proxy:
    internal: true

# The certificate and key the Dozzle agent and the homelab's Dozzle hub authenticate each other with: one pair, made
# once with `dozzle generate-certs`, the same on the hub and on every agent (docs/installing.md#dozzles-certificate).
# Files on the host, owned by root: the agent runs as root without capabilities, so it can read only a file that root
# owns. Compose mounts each read-only at /run/secrets/<name>, and the agent doesn't start while one is missing, so it
# never falls back to the built-in pair. Never committed, and never in the stack's backups (they copy read-write
# mounts only): keep the key in a password manager.
secrets:
  dozzle_cert:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/dozzle/certs/dozzle_cert.pem
  dozzle_key:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/dozzle/certs/dozzle_key.pem
